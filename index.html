<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活平衡助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>生活平衡助手</h1>
            <div id="datetime" class="datetime"></div>
            <div id="workday-status"></div>
        </header>

        <section class="card">
            <h2>天气与穿衣</h2>
            <div class="weather-clothes">
                <div class="weather-info" id="weather-info">
                    <div class="weather-icon" id="weather-icon"></div>
                    <div class="weather-detail">
                        <span id="weather-status"></span>
                        <span id="weather-temp"></span>
                        <span id="weather-desc"></span>
                    </div>
                </div>
                <div class="clothes-suggestion" id="clothes-suggestion">
                    <h3>穿衣建议</h3>
                    <p id="clothes-text"></p>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>今日餐单建议</h2>
            <div class="meal-grid">
                <div class="meal-card">
                    <div class="meal-header">
                        <span class="meal-time">早餐</span>
                        <span class="meal-clock">7:00-9:00</span>
                    </div>
                    <div class="meal-body" id="breakfast"></div>
                </div>
                <div class="meal-card">
                    <div class="meal-header">
                        <span class="meal-time">午餐</span>
                        <span class="meal-clock">11:30-13:00</span>
                    </div>
                    <div class="meal-body" id="lunch"></div>
                </div>
                <div class="meal-card">
                    <div class="meal-header">
                        <span class="meal-time">晚餐</span>
                        <span class="meal-clock">18:00-19:30</span>
                    </div>
                    <div class="meal-body" id="dinner"></div>
                </div>
            </div>
            <button class="btn btn-reload" id="reload-meal">重新生成餐单</button>
        </section>

        <section class="card">
            <h2>今日状态记录</h2>
            <table class="status-table">
                <thead>
                    <tr>
                        <th>时段</th>
                        <th>时间段</th>
                        <th>类型</th>
                        <th>备注</th>
                    </tr>
                </thead>
                <tbody id="status-tbody"></tbody>
            </table>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
